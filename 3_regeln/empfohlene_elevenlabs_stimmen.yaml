# Empfohlene ElevenLabs-Stimmen fuer das Film-Studio
# ====================================================
# Alle unten eingetragenen Standard-Voice-IDs sind offizielle ElevenLabs-Premade-Stimmen,
# die auf jedem ElevenLabs-Konto (auch Free-Tier) sofort verfuegbar sind und mit
# `eleven_multilingual_v2` natuerliches, klares Deutsch sprechen.
#
# Eigene oder geklonte Stimmen koennen jederzeit eingetragen werden:
#   https://elevenlabs.io/app/voice-library -> Stimme oeffnen -> "Copy Voice ID"

haupt_erzaehler:
  # "Daniel" - ruhig, warm, dokumentarisch, unaufgeregt ("In dieser Stadt...")
  voice_id: "onwK4e9ZLuTAKqWW03F9"
  name: "Daniel (Erzaehler - ruhig, dokumentarisch)"
  model_id: "eleven_multilingual_v2"
  settings:
    stability: 0.48
    similarity_boost: 0.80
    style: 0.22
    use_speaker_boost: true

