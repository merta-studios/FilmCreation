# Bewaehrte Alternativen fuer den Haupterzaehler (zum schnellen Tauschen):
# - "JBFqnCBsd6RMkjVDRZzb"  (George - warm, maerchenhaft-ruhiger Erzaehler)
# - "N2lVS1w4EtoT3dr4eOWO"  (Callum - tief, ernst, leicht mystisch)
# - "pNInz6obpgDQGcFmaJgB"  (Adam - markant, dokumentarisch)
# - "Xb7hH8MSUJpSbSDYk0k2"  (Alice - klare, ruhige weibliche Erzaehlerin)

auswahl_kriterien:
  erzaehler:
    - Ruhig, warm, dokumentarisch, leicht geheimnisvoll - niemals werblich oder schrill.
    - Natuerliche deutsche Aussprache mit dem Modell `eleven_multilingual_v2`.
    - Deutliche Konsonanten, damit das Wort-Alignment (Timestamps) sauber greift.
  nebenstimmen:
    - Klar vom Erzaehler unterscheidbar, aber im selben ruhigen Tonfall.
    - Sparsam einsetzen: maximal 1-2 kurze Saetze pro Figur.
