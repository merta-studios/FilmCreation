# ============================================================================
#  Agenten-Helfer: kleine Werkzeuge, die man waehrend der Arbeit braucht.
#
#  check-credits      -> ElevenLabs-Guthaben aller Konten (harter Stopp-Wert)
#  inspect-assets     -> Roblox-Assets laden, Lizenz pruefen, Kontaktabzug
#  preview-storyboard -> 1 Standbild pro Shot als Storyboard (Blender, preview)
#  all                -> alles nacheinander
#
#  Start: Actions -> "4 - Agenten-Helfer" -> Run workflow -> Aufgabe waehlen
# ============================================================================
name: 4 - Agenten-Helfer

run-name: >-
  Helfer: ${{ inputs.task || 'check-credits' }}

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Aufgabe"
        type: choice
        options: [check-credits, inspect-assets, preview-storyboard, all]
        default: check-credits
      assets:
        description: "Roblox-Asset-IDs, Komma-getrennt (fuer inspect-assets)"
        default: ""
        required: false
      search:
        description: "Creator-Store-Suche, z. B. 'street lamp' (fuer inspect-assets)"
        default: ""
        required: false
      tryon:
        description: "Assets am Avatar anprobieren (braucht Blender, langsam)"
        type: boolean
        default: false
      shots:
        description: "Shots fuer das Storyboard (all, 1-4, 2,5)"
        default: "all"
        required: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  helper:
    name: Helfer-Aufgabe
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Systempakete
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core \
            libxrender1 libxi6 libxxf86vm1 libxfixes3 libgl1 libsm6 \
            libxkbcommon0 libegl1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 1_system/requirements.txt

      - name: Python-Pakete
        run: pip install -r 1_system/requirements.txt

      - name: Guthaben pruefen
        if: inputs.task == 'check-credits' || inputs.task == 'all'
        continue-on-error: true
        env:
          ELEVENLABS_API_KEYS: ${{ secrets.ELEVENLABS_API_KEYS }}
          ELEVENLABS_API_KEY_1: ${{ secrets.ELEVENLABS_API_KEY_1 }}
          ELEVENLABS_API_KEY_2: ${{ secrets.ELEVENLABS_API_KEY_2 }}
          ELEVENLABS_API_KEY_3: ${{ secrets.ELEVENLABS_API_KEY_3 }}
          ELEVENLABS_API_KEY_4: ${{ secrets.ELEVENLABS_API_KEY_4 }}
          ELEVENLABS_API_KEY_5: ${{ secrets.ELEVENLABS_API_KEY_5 }}
        run: |
          mkdir -p helper
          python -m 1_system.audio.generate_timeline --credits-only \
            --json-out helper/credits.json

      - name: Assets pruefen
        if: >-
          (inputs.task == 'inspect-assets' || inputs.task == 'all') &&
          (inputs.assets != '' || inputs.search != '')
        continue-on-error: true
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_USER_ID: ${{ secrets.ROBLOX_USER_ID }}
        run: |
          mkdir -p helper/assets
          args=(--out helper/assets)
          if [ -n "${{ inputs.assets }}" ]; then
            args+=(--assets "${{ inputs.assets }}")
          fi
          if [ -n "${{ inputs.search }}" ]; then
            args+=(--search "${{ inputs.search }}" --limit 6)
          fi
          if [ "${{ inputs.tryon }}" = "true" ]; then
            pip install bpy==4.2.0
            args+=(--tryon)
          fi
          python -m 1_system.roblox_api.asset_inspector "${args[@]}" \
            --json > helper/assets/assets.json

      - name: Blender installieren (Storyboard)
        if: inputs.task == 'preview-storyboard' || inputs.task == 'all'
        run: pip install bpy==4.2.0

      - name: Storyboard rendern
        if: inputs.task == 'preview-storyboard' || inputs.task == 'all'
        env:
          RENDER_DEVICE: CPU
        run: |
          mkdir -p render_output/preview
          args=(--preview-storyboard --still
                --shots "${{ inputs.shots }}"
                --out-dir render_output/preview
                --manifest render_output/preview/render_manifest.json)
          python -m 1_system.blender_engine.scene_builder "${args[@]}"
          python -m 1_system.tools.preview_storyboard \
            --shots-dir render_output/preview \
            --out render_output/preview_storyboard.png \
            --timeline render_session/timeline_resolved.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helper-${{ inputs.task }}
          path: |
            helper/
            render_output/preview_storyboard.png
          retention-days: 14
          if-no-files-found: warn

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "## Helfer: ${{ inputs.task }}"
            echo ""
            if [ -f helper/credits.json ]; then
              echo "### Guthaben"
              python -c "import json;d=json.load(open('helper/credits.json'));print(f\"* Verfuegbar: **{d['total_remaining']}** Zeichen\");print(f\"* Bedarf: **{d['needed']}** Zeichen\");print('* Status: ' + ('AUSREICHEND' if d['ok'] else 'ZU WENIG'))"
            fi
            if [ -f helper/assets/report.md ]; then
              echo ""
              echo "### Assets"
              head -30 helper/assets/report.md
            fi
            if [ -f render_output/preview_storyboard.png ]; then
              echo ""
              echo "### Storyboard"
              echo "Siehe Artefakt \`preview_storyboard.png\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
