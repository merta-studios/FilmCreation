name: Agent Helper
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Modus
        required: true
        type: choice
        options: [check-credits, inspect-assets, preview-storyboard]
      estimated_chars:
        description: Bedarf in Zeichen inklusive Puffer
        type: number
        default: 2000
permissions:
  contents: read
jobs:
  helper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3' 'PyYAML>=6,<7'
      - name: Guthaben prüfen
        if: inputs.mode == 'check-credits'
        env:
          ELEVENLABS_API_KEYS: ${{ secrets.ELEVENLABS_API_KEYS }}
          ELEVENLABS_API_KEY_1: ${{ secrets.ELEVENLABS_API_KEY_1 }}
          ELEVENLABS_API_KEY_2: ${{ secrets.ELEVENLABS_API_KEY_2 }}
          ELEVENLABS_API_KEY_3: ${{ secrets.ELEVENLABS_API_KEY_3 }}
          ELEVENLABS_API_KEY_4: ${{ secrets.ELEVENLABS_API_KEY_4 }}
          ELEVENLABS_API_KEY_5: ${{ secrets.ELEVENLABS_API_KEY_5 }}
          ELEVENLABS_API_KEY_6: ${{ secrets.ELEVENLABS_API_KEY_6 }}
          ELEVENLABS_API_KEY_7: ${{ secrets.ELEVENLABS_API_KEY_7 }}
          ELEVENLABS_API_KEY_8: ${{ secrets.ELEVENLABS_API_KEY_8 }}
          ELEVENLABS_API_KEY_9: ${{ secrets.ELEVENLABS_API_KEY_9 }}
          ELEVENLABS_API_KEY_10: ${{ secrets.ELEVENLABS_API_KEY_10 }}
          ESTIMATED_CHARS: ${{ inputs.estimated_chars }}
        run: python -m 1_system.audio.elevenlabs_pool --estimated-chars "$ESTIMATED_CHARS"
      - name: Blender und Vorschau-Abhängigkeiten installieren
        if: inputs.mode == 'preview-storyboard'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxrender1 libxi6 libxxf86vm1 libxfixes3 libgl1 libsm6 libxkbcommon0
          pip install 'bpy==4.2.0' pillow
      - name: Demo-Storyboard rendern
        if: inputs.mode == 'preview-storyboard'
        run: |
          python -m 1_system.tools.validate_film --strict
          mkdir -p preview_output
          for shot in 1 2 3 4; do
            python -m 1_system.blender_engine.scene_builder --shot "$shot" --frames 48 --width 270 --height 480 --samples 4 --still --output "preview_output/shot_${shot}.png"
          done
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'preview-storyboard'
        with:
          name: demo-storyboard-${{ github.run_id }}
          path: preview_output/
      - name: Asset-Inspektion nicht verfügbar
        if: inputs.mode == 'inspect-assets'
        run: |
          echo '::error::3D-Asset-Inspektion und Anprobe sind noch nicht implementiert.'
          exit 1
