# TEMPORAER: Diagnose-Workflow, wird nach der Fehlersuche geloescht.
name: _diag

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Systempakete
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core \
            libxrender1 libxi6 libxxf86vm1 libxfixes3 libgl1 libsm6 \
            libxkbcommon0 libegl1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pakete
        run: |
          pip install -r 1_system/requirements.txt
          pip install bpy==4.2.0

      - name: Diagnose
        env:
          RENDER_DEVICE: CPU
        run: |
          set -x
          LOG=/tmp/diag.log
          exec > >(tee -a "$LOG") 2>&1
          python -c "import bpy; print('BPY', bpy.app.version_string)"; echo "exit=$?"
          python -m 1_system.blender_engine.scene_builder --list-shots; echo "list-shots exit=$?"
          python -m 1_system.blender_engine.scene_builder \
            --preview-storyboard --still --shots 1 \
            --out-dir render_output/smoke \
            --manifest render_output/smoke/render_manifest.json; echo "still exit=$?"
          ls -l render_output/smoke || true
          cp "$LOG" diag.log || true

      - name: Log in den Branch committen
        if: always()
        run: |
          cp /tmp/diag.log diag.log 2>/dev/null || echo "kein Log" > diag.log
          git config user.name "diag-bot"
          git config user.email "diag@example.invalid"
          git add -f diag.log
          git commit -m "diag: Blender-Rauchtest-Log [skip ci]" || true
          git push origin HEAD:${GITHUB_REF_NAME} || true
