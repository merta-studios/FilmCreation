# ============================================================================
#  SCHRITT 1: Film rendern
#  Audio (ElevenLabs) -> Timeline -> Master-Ton -> Shots (Kaggle 2x T4 oder GitHub)
#
#  Start: Actions -> "1 - Film rendern" -> Run workflow
#  Ergebnis: Artefakte "render-session" und "render-shots"; danach startet
#            automatisch "2 - Film fertigstellen".
# ============================================================================
name: 1 - Film rendern

run-name: >-
  Render: ${{ inputs.shots || 'alle Shots' }} |
  Ziel: ${{ inputs.render_target || 'auto' }} |
  Quelle: ${{ inputs.source_run_id || 'neu' }} |
  Qualitaet: ${{ inputs.quality || 'auto' }}

on:
  workflow_dispatch:
    inputs:
      shots:
        description: "Shots: all, 1-4 oder 2,5,7"
        default: "all"
        required: false
      quality:
        description: "Qualitaet (auto = Film-Config; github-Fallback nutzt preview)"
        type: choice
        options: [auto, preview, high, max]
        default: auto
      render_target:
        description: "Wo rendern? auto = Kaggle wenn Zugang vorhanden, sonst GitHub"
        type: choice
        options: [auto, kaggle, github]
        default: auto
      subtitles:
        description: "TikTok-Untertitel einbrennen? auto = Wert aus film_config.yaml"
        type: choice
        options: [auto, "true", "false"]
        default: auto
      kaggle_timeout_minutes:
        description: "Maximale Wartezeit auf Kaggle (Minuten)"
        default: "320"
        required: false
      skip_credit_check:
        description: "Guthaben-Pruefung ueberspringen (nicht empfohlen)"
        type: boolean
        default: false
      source_run_id:
        description: "Vorhandene Session fuer Fallback wiederverwenden (interner Gebrauch)"
        default: ""
        required: false

permissions:
  contents: read
  actions: write

concurrency:
  group: film-render
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # -------------------------------------------------------------------------- #
  # 1/3  Audio, Timeline, Master-Ton
  # -------------------------------------------------------------------------- #
  audio:
    name: 1/3 Audio, Timeline, Ton
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Systempakete (FFmpeg + Schriften)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 1_system/requirements.txt

      - name: Python-Pakete
        run: pip install -r 1_system/requirements.txt

      - name: Film pruefen
        run: python -m 1_system.tools.validate_film --json render_session/validation.json

      - name: Vorhandene Session fuer Fallback laden
        if: inputs.source_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: render-session
          path: render_session
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GH_CALLBACK_TOKEN || github.token }}

      - name: Guthaben pruefen (harter Stopp vor jedem Credit)
        if: ${{ !inputs.skip_credit_check && inputs.source_run_id == '' }}
        env:
          ELEVENLABS_API_KEYS: ${{ secrets.ELEVENLABS_API_KEYS }}
          ELEVENLABS_API_KEY_1: ${{ secrets.ELEVENLABS_API_KEY_1 }}
          ELEVENLABS_API_KEY_2: ${{ secrets.ELEVENLABS_API_KEY_2 }}
          ELEVENLABS_API_KEY_3: ${{ secrets.ELEVENLABS_API_KEY_3 }}
          ELEVENLABS_API_KEY_4: ${{ secrets.ELEVENLABS_API_KEY_4 }}
          ELEVENLABS_API_KEY_5: ${{ secrets.ELEVENLABS_API_KEY_5 }}
          ELEVENLABS_API_KEY_6: ${{ secrets.ELEVENLABS_API_KEY_6 }}
          ELEVENLABS_API_KEY_7: ${{ secrets.ELEVENLABS_API_KEY_7 }}
          ELEVENLABS_API_KEY_8: ${{ secrets.ELEVENLABS_API_KEY_8 }}
          ELEVENLABS_API_KEY_9: ${{ secrets.ELEVENLABS_API_KEY_9 }}
          ELEVENLABS_API_KEY_10: ${{ secrets.ELEVENLABS_API_KEY_10 }}
        run: |
          mkdir -p render_session
          python -m 1_system.audio.generate_timeline --credits-only \
            --json-out render_session/credits.json

      - name: Sprachaufnahme + wortgenaue Timeline
        if: inputs.source_run_id == ''
        env:
          ELEVENLABS_API_KEYS: ${{ secrets.ELEVENLABS_API_KEYS }}
          ELEVENLABS_API_KEY_1: ${{ secrets.ELEVENLABS_API_KEY_1 }}
          ELEVENLABS_API_KEY_2: ${{ secrets.ELEVENLABS_API_KEY_2 }}
          ELEVENLABS_API_KEY_3: ${{ secrets.ELEVENLABS_API_KEY_3 }}
          ELEVENLABS_API_KEY_4: ${{ secrets.ELEVENLABS_API_KEY_4 }}
          ELEVENLABS_API_KEY_5: ${{ secrets.ELEVENLABS_API_KEY_5 }}
          ELEVENLABS_API_KEY_6: ${{ secrets.ELEVENLABS_API_KEY_6 }}
          ELEVENLABS_API_KEY_7: ${{ secrets.ELEVENLABS_API_KEY_7 }}
          ELEVENLABS_API_KEY_8: ${{ secrets.ELEVENLABS_API_KEY_8 }}
          ELEVENLABS_API_KEY_9: ${{ secrets.ELEVENLABS_API_KEY_9 }}
          ELEVENLABS_API_KEY_10: ${{ secrets.ELEVENLABS_API_KEY_10 }}
        run: |
          python -m 1_system.audio.generate_timeline \
            --out-dir render_session \
            --json-out render_session/timeline_summary.json

      - name: Musik, SFX und Untertitel mischen
        run: |
          python -m 1_system.tools.mix_audio \
            --timeline render_session/timeline_resolved.json \
            --out render_session/master_audio.wav \
            --report render_session/audio_report.json \
            --captions render_session/captions.ass

      - name: Uebersicht der Shots
        run: |
          python -m 1_system.blender_engine.scene_builder \
            --timeline render_session/timeline_resolved.json --list-shots

      - uses: actions/upload-artifact@v4
        with:
          name: render-session
          path: render_session/
          retention-days: 21
          if-no-files-found: error

  # -------------------------------------------------------------------------- #
  # 2/3  Shots rendern (Kaggle 2x T4, Fallback GitHub-Runner)
  # -------------------------------------------------------------------------- #
  shots:
    name: 2/3 Shots rendern
    needs: audio
    outputs:
      render_target: ${{ steps.target.outputs.target }}
      kaggle_outcome: ${{ steps.kaggle.outcome }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Systempakete (Blender-Bibliotheken, FFmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core \
            libxrender1 libxi6 libxxf86vm1 libxfixes3 libgl1 libsm6 \
            libxkbcommon0 libegl1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 1_system/requirements.txt

      - name: Python-Pakete
        run: pip install -r 1_system/requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: render-session
          path: render_session

      - name: Renderziel bestimmen
        id: target
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          target="${{ inputs.render_target }}"
          if [ "$target" = "auto" ]; then
            if [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ]; then
              target="kaggle"
            else
              target="github"
            fi
          fi
          quality="${{ inputs.quality }}"
          if [ "$target" = "github" ] && [ "$quality" = "auto" ]; then
            quality="preview"
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "quality=$quality" >> "$GITHUB_OUTPUT"
          echo "Rendere auf **$target** mit Qualitaet **$quality**" >> "$GITHUB_STEP_SUMMARY"

      - name: Kaggle-Render (2x T4, parallel)
        id: kaggle
        if: steps.target.outputs.target == 'kaggle'
        continue-on-error: true
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          pip install "kaggle>=1.8.4,<2" six
          mkdir -p render_output
          args=(--shots "${{ inputs.shots }}"
                --timeout-minutes "${{ inputs.kaggle_timeout_minutes }}")
          if [ -n "${{ steps.target.outputs.quality }}" ] && \
             [ "${{ steps.target.outputs.quality }}" != "auto" ]; then
            args+=(--quality "${{ steps.target.outputs.quality }}")
          fi
          python -m 1_system.kaggle_bridge.parallel_render start \
            --session-dir render_session --out-dir render_output --no-wait "${args[@]}"

      - name: Blender fuer den GitHub-Fallback installieren
        if: >-
          steps.target.outputs.target == 'github' ||
          steps.kaggle.outcome == 'failure'
        run: pip install bpy==4.2.0

      - name: Direkt auf GitHub rendern
        if: >-
          steps.target.outputs.target == 'github' ||
          steps.kaggle.outcome == 'failure'
        env:
          RENDER_DEVICE: CPU
        run: |
          mkdir -p render_output/shots
          args=()
          quality="${{ steps.target.outputs.quality }}"
          if [ -n "$quality" ] && [ "$quality" != "auto" ]; then
            args+=(--quality "$quality")
          fi
          python -m 1_system.blender_engine.scene_builder \
            --film-dir 2_aktueller_film \
            --timeline render_session/timeline_resolved.json \
            --shots "${{ inputs.shots }}" \
            --out-dir render_output/shots \
            --manifest render_output/shots/render_manifest.json \
            "${args[@]}"

      - name: Manifest zusammenfuehren
        if: always() && (steps.target.outputs.target == 'github' || steps.kaggle.outcome == 'failure')
        run: |
          python - <<'PY'
          from pathlib import Path
          from importlib import import_module
          parallel = import_module("1_system.kaggle_bridge.parallel_render")
          sources = [path for path in (Path("render_output/shots"), Path("render_output"),
                                       Path("render_output/kaggle_output")) if path.is_dir()]
          if not sources:
              raise SystemExit("Keine Render-Ausgabe gefunden")
          merged = parallel.merge_manifests(sources, Path("render_output/render_manifest.json"))
          print(f"Shots im Manifest: {len(merged['shots'])}")
          PY

      - name: Shots pruefen
        if: always()
        continue-on-error: true
        run: |
          python -m 1_system.tools.check_shots \
            --timeline render_session/timeline_resolved.json \
            --manifest render_output/render_manifest.json \
            --shots-dir render_output/shots \
            --json-out render_output/shot_check.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-shots
          path: |
            render_output/shots/
            render_output/render_manifest.json
            render_output/shot_check.json
            render_output/kaggle_status.json
          retention-days: 21
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaggle-state
          path: render_output/kaggle_status.json
          retention-days: 7
          if-no-files-found: ignore

  # -------------------------------------------------------------------------- #
  # 3/3  Schnitt anstossen
  # -------------------------------------------------------------------------- #
  notify:
    name: 3/3 Film fertigstellen starten
    needs: [audio, shots]
    if: needs.shots.outputs.render_target != 'kaggle' || needs.shots.outputs.kaggle_outcome == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Workflow 2 starten
        env:
          GH_TOKEN: ${{ secrets.GH_CALLBACK_TOKEN || github.token }}
          SUBTITLES: ${{ inputs.subtitles }}
        run: |
          gh workflow run 2-finish-film.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f run_id="${{ github.run_id }}" \
            -f subtitles="$SUBTITLES" \
            -f quality="${{ inputs.quality }}"
          echo "### Naechster Schritt" >> "$GITHUB_STEP_SUMMARY"
          echo "Der Schnitt laeuft in **2 - Film fertigstellen** (Run ${{ github.run_id }})." \
            >> "$GITHUB_STEP_SUMMARY"
