name: Tests and Blender smoke test
on:
  push:
    paths:
      - '1_system/**'
      - '2_aktueller_film/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '1_system/**'
      - '2_aktueller_film/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libxrender1 libxi6 libxxf86vm1 libxfixes3 libgl1 libsm6 libxkbcommon0 ffmpeg
      - run: pip install -r 1_system/requirements.txt pytest 'bpy==4.2.0'
      - run: python -m compileall -q 1_system 2_aktueller_film && python -m pytest -q
      - name: Blender-Demobild
        run: python -m 1_system.blender_engine.scene_builder --shot 1 --frames 12 --width 90 --height 160 --samples 1 --still --output render_output/smoke.png
      - name: Blender-Animationsclip
        run: |
          python -m 1_system.blender_engine.scene_builder --shot 1 --frames 3 --width 90 --height 160 --samples 1 --output render_output/shot_001.mp4
          test -s render_output/shot_001.mp4
          ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of default=nw=1 render_output/shot_001.mp4 | grep -x 'nb_read_frames=3'
      - uses: actions/upload-artifact@v4
        with:
          name: blender-smoke-${{ github.run_id }}
          path: render_output/smoke.png
