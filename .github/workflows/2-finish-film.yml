# ============================================================================
#  SCHRITT 2: Film fertigstellen
#  Holt die Shots (aus Workflow 1 oder direkt aus dem Kaggle-Kernel), mischt Ton,
#  brennt die TikTok-Untertitel ein und laedt den fertigen 9:16-Film hoch.
#
#  Start: automatisch nach Workflow 1 / per Kernel-Callback / manuell:
#  Actions -> "2 - Film fertigstellen" -> Run workflow (run_id eingeben)
# ============================================================================
name: 2 - Film fertigstellen

run-name: >-
  Schnitt fuer Run ${{ inputs.run_id || github.event.workflow_run.id || 'manuell' }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run-ID von Workflow 1 (leer = Artefakte aus Kaggle-Kernel)"
        default: ""
        required: false
      kaggle_kernel:
        description: "Kaggle-Kernel (USER/SLUG) - laedt Shots direkt von Kaggle"
        default: ""
        required: false
      subtitles:
        description: "Untertitel: auto = film_config.yaml"
        type: choice
        options: [auto, "true", "false"]
        default: auto
      quality:
        description: "Qualitaet wurde in Workflow 1 gesetzt (nur Info)"
        default: auto
        required: false
  workflow_run:
    workflows: ["1 - Film rendern"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: film-finish
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  finish:
    name: Schnitt, Ton, Untertitel, Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      SOURCE_RUN: ${{ inputs.run_id || github.event.workflow_run.id }}
      KERNEL_SLUG: ${{ inputs.kaggle_kernel || '' }}
      SUBTITLES_CHOICE: ${{ inputs.subtitles || 'auto' }}
    steps:
      - uses: actions/checkout@v4

      - name: Systempakete (FFmpeg + Schriften)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 1_system/requirements.txt

      - name: Python-Pakete
        run: pip install -r 1_system/requirements.txt

      - name: Render-Session aus Workflow 1 holen
        uses: actions/download-artifact@v4
        with:
          name: render-session
          path: render_session
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ secrets.GH_CALLBACK_TOKEN || github.token }}
        continue-on-error: true

      - name: Shots aus Workflow 1 holen
        uses: actions/download-artifact@v4
        with:
          name: render-shots
          path: render_output
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ secrets.GH_CALLBACK_TOKEN || github.token }}
        continue-on-error: true

      - name: Shots direkt von Kaggle holen (falls Artefakt fehlt)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -f render_output/render_manifest.json ]; then
            echo "Manifest aus Artefakt vorhanden - Kaggle-Download nicht noetig."
            exit 0
          fi
          if [ -z "$KERNEL_SLUG" ]; then
            echo "Kein Kaggle-Kernel angegeben - ueberspringe Download." 
            exit 0
          fi
          pip install "kaggle>=1.8.4,<2" six
          python -m 1_system.kaggle_bridge.parallel_render download \
            --kernel "$KERNEL_SLUG" --out-dir render_output

      - name: Shots pruefen
        run: |
          python -m 1_system.tools.check_shots \
            --timeline render_session/timeline_resolved.json \
            --manifest render_output/render_manifest.json \
            --shots-dir render_output/shots \
            --json-out render_output/shot_check.json

      - name: Master-Ton sicherstellen
        run: |
          if [ -f render_session/master_audio.wav ]; then
            echo "Master-Ton aus Workflow 1 vorhanden."
            exit 0
          fi
          python -m 1_system.tools.mix_audio \
            --timeline render_session/timeline_resolved.json \
            --out render_session/master_audio.wav \
            --report render_session/audio_report.json \
            --captions render_session/captions.ass

      - name: Finalen 9:16-Film schneiden
        run: |
          python -m 1_system.tools.assemble_final \
            --timeline render_session/timeline_resolved.json \
            --manifest render_output/render_manifest.json \
            --audio render_session/master_audio.wav \
            --config 2_aktueller_film/film_config.yaml \
            --output render_output/final_film.mp4 \
            --storyboard render_output/storyboard.png \
            --report render_output/film_info.md \
            --subtitles "$SUBTITLES_CHOICE" \
            --shots-dir render_output/shots

      - name: Ergebnis pruefen (Dauer, Aufloesung, Ton)
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          film = Path("render_output/final_film.mp4")
          if not film.is_file() or film.stat().st_size < 100000:
              sys.exit("final_film.mp4 fehlt oder ist zu klein")
          info = subprocess.run(["ffprobe", "-v", "error", "-show_entries",
                                 "stream=codec_type,width,height,r_frame_rate",
                                 "-of", "json", str(film)],
                                capture_output=True, text=True).stdout
          streams = json.loads(info or "{}").get("streams", [])
          video = next((s for s in streams if s.get("codec_type") == "video"), {})
          audio = next((s for s in streams if s.get("codec_type") == "audio"), None)
          if (video.get("width"), video.get("height")) != (1080, 1920):
              sys.exit(f"Aufloesung ist {video.get('width')}x{video.get('height')}, erwartet 1080x1920")
          if video.get("r_frame_rate") not in ("24/1", "24"):
              sys.exit(f"Bildrate ist {video.get('r_frame_rate')}, erwartet 24 fps")
          if audio is None:
              sys.exit("Tonspur fehlt")
          print(f"OK: {film.stat().st_size / 1048576:.1f} MB, 1080x1920, 24 fps, mit Ton")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: final-film
          path: |
            render_output/final_film.mp4
            render_output/storyboard.png
            render_output/film_info.md
            render_output/shot_check.json
            render_session/captions.ass
            render_session/audio_report.json
          retention-days: 30
          if-no-files-found: error

      - name: Release mit dem fertigen Film
        env:
          GH_TOKEN: ${{ secrets.GH_CALLBACK_TOKEN || github.token }}
          SOURCE_RUN: ${{ env.SOURCE_RUN }}
        run: |
          tag="film-${SOURCE_RUN:-$(date +%Y%m%d-%H%M%S)}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" render_output/final_film.mp4 --clobber
          else
            gh release create "$tag" render_output/final_film.mp4 \
              --title "Film $tag" \
              --notes "Automatisch erzeugt aus Run ${SOURCE_RUN}. 9:16, 1080x1920, 24 fps."
          fi

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "## Fertiger Film"
            if [ -f render_output/final_film.mp4 ]; then
              echo ""
              echo "* Datei: \`render_output/final_film.mp4\`"
              echo "* Groesse: $(du -h render_output/final_film.mp4 | cut -f1)"
            fi
            if [ -f render_output/film_info.md ]; then
              echo ""
              head -20 render_output/film_info.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
