# Nur manuell oder bei Aenderungen an diesem Test auf dem Arbeitsbranch.
# Die Tests lesen Daten, erzeugen keine bezahlte Sprache und starten keinen Kernel.
name: Live-Verbindungstest
on:
  workflow_dispatch:
  push:
    branches: [arena/2711612c-filmcreation]
    paths: [.github/workflows/live-verbindungstest.yml]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r 1_system/requirements.txt kaggle six
      - name: ElevenLabs (nur Guthaben)
        env:
          ELEVENLABS_API_KEYS: ${{ secrets.ELEVENLABS_API_KEYS }}
          ELEVENLABS_API_KEY_1: ${{ secrets.ELEVENLABS_API_KEY_1 }}
          ELEVENLABS_API_KEY_2: ${{ secrets.ELEVENLABS_API_KEY_2 }}
          ELEVENLABS_API_KEY_3: ${{ secrets.ELEVENLABS_API_KEY_3 }}
          ELEVENLABS_API_KEY_4: ${{ secrets.ELEVENLABS_API_KEY_4 }}
          ELEVENLABS_API_KEY_5: ${{ secrets.ELEVENLABS_API_KEY_5 }}
          ELEVENLABS_API_KEY_6: ${{ secrets.ELEVENLABS_API_KEY_6 }}
        run: |
          python - <<'PY'
          import importlib, sys
          pool = importlib.import_module('1_system.audio.elevenlabs_pool').ElevenLabsPool()
          report = pool.check_credits(0)
          print(f"::notice::ElevenLabs: keys={len(pool.keys)}, erfolgreich={sum(s.ok for s in report.keys)}, Guthaben={report.total_remaining}")
          for status in report.keys:
              if not status.ok:
                  print(f'::notice::ElevenLabs Fehlerkategorie: {status.error}')
          if not report.keys or not any(s.ok for s in report.keys):
              print('::error::ElevenLabs Guthabenabfrage fehlgeschlagen; Key-Name und Rechte pruefen.')
              sys.exit(1)
          PY
      - name: Kaggle (eigene Kernel auflisten)
        if: always()
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          python - <<'PY'
          import importlib, sys
          client = importlib.import_module('1_system.kaggle_bridge.kaggle_client').KaggleClient()
          try:
              client.ensure_credentials()
              result = client._run(['kernels', 'list', '-m'], timeout=180, check=False)
              print(f'::notice::Kaggle: Kernel-Liste Exitcode {result.returncode}')
              if result.returncode:
                  text = result.output.lower()
                  categories = ['401', '403', '404', 'unauthorized', 'forbidden', 'unrecognized arguments', 'invalid choice', 'connectionerror', 'sslerror', 'validationerror']
                  import re
                  kinds = re.findall(r'(?m)^([A-Za-z][A-Za-z0-9_.]*(?:Error|Exception))(?::|$)', result.output)
                  print('::notice::Kaggle Fehlerindikatoren: ' + ', '.join(c for c in categories if c in text) + '; Ausnahmetypen: ' + ', '.join(kinds))
                  print('::error::Kaggle Authentifizierung oder Kernel-Liste fehlgeschlagen.')
                  sys.exit(1)
          except Exception as exc:
              print(f'::error::Kaggle-Test fehlgeschlagen: {type(exc).__name__}')
              sys.exit(1)
          PY
      - name: Roblox Open Cloud
        if: always()
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_USER_ID: ${{ secrets.ROBLOX_USER_ID }}
        run: |
          python - <<'PY'
          import importlib, sys
          client = importlib.import_module('1_system.roblox_api.open_cloud').RobloxClient()
          try:
              report = client.verify()
              fields = ('search_ok', 'metadata_ok', 'delivery_ok', 'thumbnails_ok')
              print('::notice::Roblox: ' + ', '.join(f'{key}={report[key]}' for key in fields))
              if not all(report[key] for key in fields):
                  text = ' '.join(report['errors']).lower()
                  categories = ['401', '403', '404', '429', 'creator-store', 'asset-delivery', 'metadaten']
                  print('::notice::Roblox Fehlerindikatoren: ' + ', '.join(c for c in categories if c in text))
                  for item in report['errors']:
                      label = item.split(':', 1)[0]
                      if label in ('Creator-Store', 'Asset-Metadaten', 'Asset-Delivery', 'Thumbnails'):
                          codes = [c for c in ('401', '403', '404', '429', '500', '503') if c in item]
                          print(f'::notice::Roblox {label}: HTTP {",".join(codes) or "unbekannt"}')
                  print('::error::Roblox: Mindestens ein Endpunkt fehlgeschlagen (Key, Scopes oder Asset-Zugriff pruefen).')
                  sys.exit(1)
          except Exception as exc:
              print(f'::error::Roblox-Test fehlgeschlagen: {type(exc).__name__}')
              sys.exit(1)
          PY
