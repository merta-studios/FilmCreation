titel: "In dieser Stadt leuchtet dein Name"
segments:
  - id: 1
    speaker: haupt_erzaehler
    emotion: ruhig
    text: >
      In dieser Stadt bekommt jede Laterne jeden Abend genau einen Namen. Wenn jemand den Namen laut sagt, leuchtet sie bis zum Morgen. Wenn nicht, bleibt die Straße dunkel. Und niemand fragt, warum manche Fenster schon früh schwarz werden.
    pause_after: 0.7
  - id: 2
    speaker: haupt_erzaehler
    emotion: traurig
    text: >
      Ich bin Nuri. Meine Laterne ist seit drei Abenden aus. Mama sagt, sie spricht meinen Namen doch ständig. Aber meistens ruft sie nur: Schuhe! Bus! Beeil dich! Das klingt nicht wie ein Name. In der Schule zählt Herr Bender die Lichter am Ende der Straße. Er sagt, die Stadt sei sicher, solange genug davon brennen. Dabei schaut er nie nach, wer im Dunkeln steht.
    pause_after: 0.6
  - id: 3
    speaker: haupt_erzaehler
    emotion: hoffnungsvoll
    text: >
      Heute kommt Oma mit mir nach Hause. Sie geht langsam, und ich passe mich ihrem Schritt an. Vor dem Laden bleibt sie stehen. Über uns hängt ihre Laterne, hell und golden. Sie sagt: Nuri. Nur einmal. Das Licht springt an. Dann zeigt sie auf meine dunkle Straße. Und wer sagt deinen Namen dort?
    pause_after: 0.6
  - id: 4
    speaker: haupt_erzaehler
    emotion: ruhig
    text: >
      Ich weiß es nicht. Mama sitzt am Küchentisch, zwischen ungeöffneten Briefen und kaltem Tee. Ich will schon wieder Beeil dich sagen. Stattdessen setze ich mich hin. Mama, ich bin Nuri. Sie sieht mich an, als würde sie mich zum ersten Mal heute wirklich sehen.
    pause_after: 0.6
  - id: 5
    speaker: haupt_erzaehler
    emotion: hoffnungsvoll
    text: >
      Dann nimmt sie meine Hand. Nuri, sagt sie, und draußen geht eine Laterne nach der anderen an. Die Nachbarn öffnen ihre Türen. Einer spricht einen Namen, dann der nächste. Unsere Straße klingt plötzlich nach Menschen, die einander bemerken.
    pause_after: 0.8
  - id: 6
    speaker: haupt_erzaehler
    emotion: warm
    text: >
      Am Morgen zählt Herr Bender die Lichter. Diesmal zählt er auch die Menschen darunter. Oma wartet am Gartentor. Mama wartet neben ihr. Und ich gehe nicht schneller, nur weil die Stadt es eilig hat. In dieser Stadt reicht ein Name, um eine Straße heller zu machen. Man muss ihn nur wirklich meinen.
    pause_after: 1.0
